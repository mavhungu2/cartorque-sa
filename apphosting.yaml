# Firebase App Hosting configuration for Car Torque SA.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

# Secret references. Values live in Google Secret Manager
# (project cartorque-sa). Add NEXT_PUBLIC_FIREBASE_* secrets here once the
# Web App config is available (currently Phase 2 functionality only).
env:
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
    availability: [BUILD, RUNTIME]
